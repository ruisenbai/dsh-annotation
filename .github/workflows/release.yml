name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
      - name: Detect a prebuilt GitHub release asset
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versioned="dsh-annotation-${{ steps.version.outputs.value }}.tgz"
          assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -Fxq "${versioned}" <<<"${assets}" && grep -Fxq 'dsh-annotation.tgz' <<<"${assets}"; then
            echo 'available=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'available=false' >> "${GITHUB_OUTPUT}"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.prebuilt.outputs.available != 'true'
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        if: steps.prebuilt.outputs.available != 'true'
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
        if: steps.prebuilt.outputs.available != 'true'
      - name: Install Chromium
        if: steps.prebuilt.outputs.available != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser regressions
        if: steps.prebuilt.outputs.available != 'true'
        run: pnpm test:browser
      - if: steps.prebuilt.outputs.available != 'true'
        run: pnpm test:coverage
      - if: steps.prebuilt.outputs.available != 'true'
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          cp "artifacts/dsh-annotation-${{ steps.version.outputs.value }}.tgz" artifacts/dsh-annotation.tgz
      - name: Create GitHub release
        if: steps.prebuilt.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.tgz --verify-tag --generate-notes
