name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Install Chromium
        if: matrix.node == '24.x'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser regressions
        if: matrix.node == '24.x'
        run: pnpm test:browser
      - run: pnpm build
      - run: pnpm verify:bundle
      - run: pnpm publint
      - name: Pack release candidate
        if: matrix.node == '24.x'
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24.x'
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
