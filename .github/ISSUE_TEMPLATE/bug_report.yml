name: Bug report
description: Report a reproducible plugin defect
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private prompts, selected text, credentials, or complete Session logs.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.1.0-rc.6
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Chrome 130, Node 24
    validations:
      required: true
  - type: dropdown
    id: session-state
    attributes:
      label: Session state
      options:
        - Idle
        - Running
        - Waiting for approval or question
        - Archived
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic text and the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized console error
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private data and credentials.
          required: true
        - label: This is not a security vulnerability.
          required: true
