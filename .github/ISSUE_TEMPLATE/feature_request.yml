name: 功能建议
description: 提出能改善使用体验的建议
title: '[建议] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请说明你在什么场景下遇到了困难。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望效果
      description: 请描述用户最终能做什么，可以给一个具体例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 尝试过的替代办法
  - type: input
    id: dsh-version
    attributes:
      label: 相关 DSH 版本
      placeholder: 例如 0.2.2-rc.1
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有问题和讨论。
          required: true
        - label: 我已考虑对隐私、草稿保存和已发送历史的影响。
          required: true
