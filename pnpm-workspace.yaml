packages:
  - .

allowBuilds:
  # Cross-platform boundary for the persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # First-party workspace script (registry build of the harness package).
  '@deepseek-ai/dsh-subprocess-local': true
  # Optional LLM API backend no-op lifecycle scripts; deny, install still succeeds.
  '@google/genai': false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh@0.1.2-alpha.1'
  - '@deepseek-ai/dsh-agent-presets@0.1.2-alpha.1'
